name: Renderer mode contract
on:
  push:
    paths:
      - 'src/router-envelope-validator.js'
      - 'src/agent-renderer.js'
      - 'src/router-mode-contract.test.js'
      - '.github/workflows/renderer-mode-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mode-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test src/router-mode-contract.test.js
