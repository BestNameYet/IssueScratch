name: Build and publish stateless runtime container
on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - 'src/router-write-gate.test.js'
      - 'src/renderer-persistence.test.js'
      - '.dockerignore'
      - 'container-entrypoint.js'
      - 'src/**'
      - '.github/workflows/container-image.yml'
permissions:
  contents: read
  packages: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test validation-render write gate
        run: node --test src/router-write-gate.test.js
      - name: Test renderer persistence
        run: node --test src/renderer-persistence.test.js
      - name: Run router boundary tests
        run: node --test src/router-boundary.test.js
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bestnameyet/issuescratch-runtime:latest
            ghcr.io/bestnameyet/issuescratch-runtime:sha-${{ github.sha }}
