name: Issue 1 JSON validation and diagnostic state
on:
  issue_comment:
    types: [created, edited]
  push:
    paths:
      - '.github/workflows/issue1-json-validator.yml'
      - 'src/issue1-diagnostics.js'
      - 'src/issue1-diagnostics.test.js'
      - 'src/framing-controller.js'
      - 'src/framing-controller.test.js'
      - 'src/types/issuescratch.framing-controller.v1.json'
      - 'src/opcode-document-adapter.js'
      - 'src/opcode-document-adapter.test.js'
      - 'src/readme-comment-renderer.js'
      - 'src/readme-comment-renderer.test.js'
      - 'src/types/issuescratch.operation-registry.v1.json'
      - 'src/types/issuescratch.opcode-adapter-contract.v1.json'
      - 'experiments/general-purpose-job-opcode-map.v1.json'
      - 'experiments/general-purpose-job-prompts.v1.json'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Serialize writes into the same git branch, including different comment IDs.
concurrency:
  group: issuescratch-issue1-state
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'issue_comment' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deterministic analyzer and state machine
        run: node --test src/*.test.js
      - name: Convert prompt manifest with reusable functional opcodes
        if: github.event_name != 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {convert,validate}=require('./src/opcode-document-adapter.js');
            const owner=context.repo.owner,repo=context.repo.repo;
            const originalPath='experiments/general-purpose-job-prompts.v1.json';
            const mapPath='experiments/general-purpose-job-opcode-map.v1.json';
            const registryPath='src/types/issuescratch.operation-registry.v1.json';
            const outputPath='experiments/general-purpose-job-prompts.opcoded.v1.json';
            const source=fs.readFileSync(originalPath);
            const profile=JSON.parse(fs.readFileSync(mapPath,'utf8'));
            const registry=JSON.parse(fs.readFileSync(registryPath,'utf8'));
            const obj=convert(source,{
              registry,profile,sourcePath:originalPath,
              itemsPointer:profile.selected_pointer,
              idField:profile.identity_field,
              textField:profile.text_field
            });
            const verification=validate(obj,source,registry);
            if(verification.record_count!==17)throw Error('Prompt source must contain 17 records');
            const contents=JSON.stringify(obj,null,2)+'\n';
            let current;
            try{
              const {data}=await github.rest.repos.getContent({owner,repo,path:outputPath});
              current=data;
            }catch(e){
              if(e.status!==404)throw e;
            }
            const previous=current?Buffer.from(current.content,'base64').toString('utf8'):null;
            if(previous===contents){
              core.info('Output already matches the deterministic conversion');
            }else{
              await github.rest.repos.createOrUpdateFileContents({
                owner,repo,path:outputPath,
                message:'experiments: regenerate verified opcode-encoded prompt manifest',
                content:Buffer.from(contents,'utf8').toString('base64'),
                ...(current?{sha:current.sha}:{})
              });
            }
            const {data:check}=await github.rest.repos.getContent({owner,repo,path:outputPath});
            const actual=Buffer.from(check.content,'base64').toString('utf8');
            if(actual!==contents)throw Error('Converted artifact readback mismatch');
            core.info('Converted manifest verified: '+verification.record_count+' records; '+verification.opcode_occurrences+' opcode occurrences');
      - name: Validate, measure, and persist comment state
        uses: actions/github-script@v7
        with:
          script: |
            const { sha } = require('./src/issue1-diagnostics.js');
            const { processWithController, publicationDocument, publicationEntry, isControlComment } = require('./src/framing-controller.js');
            const profile=require('./src/types/issuescratch.framing-controller.v1.json');
            const registry=require('./src/types/issuescratch.operation-registry.v1.json');
            const owner = context.repo.owner, repo = context.repo.repo;
            const eventName = context.eventName;
            const scan = eventName !== 'issue_comment';
            const comments = scan
              ? await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: 1, per_page: 100 })
              : [context.payload.comment];
            const folder = 'workspaces/issue1-diagnostics/comments';
            const stats = { inspected: 0, recorded: 0, duplicates: 0, malformed: 0, errored: 0, functions_published: 0 };
            const rows = [];
            const failures = [];

            async function readFile(path) {
              try {
                const { data } = await github.rest.repos.getContent({owner,repo,path});
                if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64') {
                  throw new Error('Expected base64 JSON file at ' + path);
                }
                return { sha: data.sha, value: JSON.parse(Buffer.from(data.content,'base64').toString('utf8')) };
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
            }
            async function writeObject(path, value, previous) {
              if (!value || typeof value !== 'object' || Array.isArray(value)) {
                throw new Error('Diagnostic and state roots must be JSON objects');
              }
              const body = JSON.stringify(value,null,2) + '\n';
              const args = {
                owner,repo,path,
                message: 'diagnostics: capture Issue #1 comment revision state',
                content: Buffer.from(body,'utf8').toString('base64'),
                ...(previous ? {sha:previous.sha} : {})
              };
              await github.rest.repos.createOrUpdateFileContents(args);
              const verified = await readFile(path);
              if (!verified || JSON.stringify(verified.value) !== JSON.stringify(value)) {
                throw new Error('Persistent JSON readback mismatch: '+path);
              }
            }
            async function sendInstruction(id, functionEntry, knownReplyId) {
              // A single source-linked bot-owned comment is updated non-destructively.
              let reply=null;
              if(knownReplyId){
                try{
                  const {data}=await github.rest.issues.getComment({owner,repo,comment_id:knownReplyId});
                  reply=data;
                }catch(e){if(e.status!==404)throw e;}
              }
              if(!reply){
                // Recover from a crash after comment creation but before state persistence.
                const issueComments=await github.paginate(github.rest.issues.listComments,{
                  owner,repo,issue_number:1,per_page:100
                });
                reply=issueComments.find(c=>{
                  if(!isControlComment(c.body||''))return false;
                  try {return JSON.parse(c.body).source_comment_id===id;}catch{return false;}
                })||null;
              }
              let history=[];
              if(reply){
                const decoded=JSON.parse(reply.body);
                if(decoded.schema!=='issuescratch.frame-control-comment.v1'||decoded.source_comment_id!==id)throw Error('Controller reply conflict');
                history=decoded.history;
              }
              const exists=history.some(x=>x.source_revision_sha256===functionEntry.source_revision_sha256&&x.target_index===functionEntry.target_index);
              if(!exists)history=[...history,functionEntry];
              const expected=JSON.stringify(publicationDocument(id,history),null,2)+'\n';
              if(!reply){
                const {data}=await github.rest.issues.createComment({owner,repo,issue_number:1,body:expected});
                reply=data;
              }else if(reply.body!==expected){
                const {data}=await github.rest.issues.updateComment({owner,repo,comment_id:reply.id,body:expected});
                reply=data;
              }
              const {data:saved}=await github.rest.issues.getComment({owner,repo,comment_id:reply.id});
              if(saved.body!==expected)throw Error('Next-function comment readback mismatch');
              return reply.id;
            }
            for (const item of comments) {
              const id = item.id;
              const url = item.html_url || ('https://github.com/'+owner+'/'+repo+'/issues/1#issuecomment-'+id);
              stats.inspected++;
              try {
                // Re-fetch current source: an event payload may represent a superseded edit.
                const {data:current} = await github.rest.issues.getComment({owner,repo,comment_id:id});
                const body = current.body ?? '';
                if(isControlComment(body)){
                  rows.push([String(id),'controller_reply_ignored','—',url]);
                  continue;
                }
                const revisionSha = sha(body);
                const root = folder+'/'+id;
                const statePath = root+'/state.json';
                const revisionPath = root+'/revisions/'+revisionSha+'.json';
                const existingState = await readFile(statePath);
                const priorState = existingState?.value ?? null;
                // Reuse a previously persisted draw after an interrupted run.
                // The function is keyed to this exact source revision and upcoming index.
                const upcoming=priorState?.progression?.accepted_entries??0;
                const pendingPath=root+'/instructions/'+String(upcoming+1).padStart(2,'0')+'.json';
                const persistedDraw=await readFile(pendingPath);
                let savedDraws=null;
                if(persistedDraw){
                  const payload=persistedDraw.value;
                  if(payload.source_revision_sha256===revisionSha &&
                     payload.next_function?.target_index===upcoming+1){
                    const selection=payload.next_function.random_selection;
                    // The replay sequence includes a higher-order operator draw,
                    // an optional ABSTRACT mode draw, and the atomic operator draw.
                    savedDraws=Array.isArray(selection?.draws)
                      ? selection.draws
                      : [{purpose:'atomic_function',pool_size:selection.pool_size,
                          selected_ordinal:selection.selected_ordinal}];
                  }
                }
                let replayCursor=0;
                const selectInt=(size)=>{
                  if(savedDraws===null)return require('node:crypto').randomInt(size);
                  const step=savedDraws[replayCursor++];
                  if(!step || step.pool_size!==size ||
                     !Number.isInteger(step.selected_ordinal)||
                     step.selected_ordinal<0||step.selected_ordinal>=size){
                    throw Error('Persisted ordered random selection mismatch at draw '+replayCursor);
                  }
                  return step.selected_ordinal;
                };
                const result=processWithController(priorState,body,id,revisionPath,eventName,profile,registry,selectInt);
                if(savedDraws!==null && !result.duplicate && savedDraws.length!==replayCursor){
                  throw Error('Persisted random draw sequence was not consumed completely');
                }
                let instruction=result.next_instruction;
                const needsRetry=result.duplicate&&priorState?.progression?.controller_status==='awaiting_publication'&&
                  !!priorState?.progression?.next_function;
                if(needsRetry)instruction=priorState.progression.next_function;
                if(result.duplicate&&!needsRetry){
                  stats.duplicates++;
                  rows.push([String(id),'unchanged',String(priorState?.progression?.accepted_entries??0),url]);
                  continue;
                }
                // Publish the instruction only after persisting its immutable JSON object.
                let actualReplyId=null;
                if(instruction){
                  const instructionPath=root+'/instructions/'+String(instruction.target_index).padStart(2,'0')+'.json';
                  const record={
                    schema:'issuescratch.frame-instruction-receipt.v1',
                    source_comment_id:id,source_revision_sha256:revisionSha,
                    next_function:instruction,publication_status:'selected'
                  };
                  const oldInstruction=await readFile(instructionPath);
                  if(oldInstruction){
                    if(JSON.stringify(oldInstruction.value)!==JSON.stringify(record))throw Error('Immutable next-function instruction conflict');
                  }else await writeObject(instructionPath,record,null);
                  const entry=publicationEntry(revisionSha,instruction);
                  actualReplyId=await sendInstruction(id,entry,
                    priorState?.progression?.controller_comment_id||null);
                  const progress=result.state.progression;
                  progress.controller_comment_id=actualReplyId;
                  progress.controller_status='delivered';
                  if(!result.duplicate){
                    // Publishing an instruction is not autonomous execution of the function.
                    result.diagnostic.functions_dispatched=0;
                    result.diagnostic.functions_published=1;
                    result.diagnostic.controller_comment_id=actualReplyId;
                  }
                  stats.functions_published++;
                }
                if(result.duplicate&&needsRetry){
                  const state={...priorState,progression:{...priorState.progression,
                    controller_comment_id:actualReplyId,controller_status:'delivered'}};
                  await writeObject(statePath,state,existingState);
                  rows.push([String(id),'redelivered_function',String(state.progression.accepted_entries),url]);
                  continue;
                }
                // Immutable source diagnostics, then the pointer to accepted state.
                const previousDiagnostic=await readFile(revisionPath);
                if(previousDiagnostic){
                  if(JSON.stringify(previousDiagnostic.value)!==JSON.stringify(result.diagnostic)){
                    throw Error('Immutable revision hash conflicts with stored diagnostics');
                  }
                }else{
                  await writeObject(revisionPath,result.diagnostic,null);
                }
                await writeObject(statePath,result.state,existingState);
                stats.recorded++;
                if (!result.diagnostic.source.json_valid) {
                  stats.malformed++;
                  core.warning('Comment '+id+': invalid JSON; state unchanged; diagnostic saved at '+revisionPath);
                } else if (result.diagnostic.source.validation_error) {
                  core.warning('Comment '+id+': '+result.diagnostic.source.validation_error.message+'; diagnostic saved');
                }
                rows.push([String(id),result.action,
                  String(result.state.progression.accepted_entries),url]);
              } catch (e) {
                stats.errored++;
                failures.push('comment '+id+': '+e.message);
                core.error('comment '+id+': '+e.message);
                rows.push([String(id),'persistence error','—',url]);
              }
            }
            await core.summary
              .addHeading('Issue #1 deterministic JSON diagnostics')
              .addRaw('Event: '+eventName+'; inspected: '+stats.inspected+'; recorded: '+stats.recorded+'; published next functions: '+stats.functions_published+'; repeated: '+stats.duplicates+'; invalid JSON: '+stats.malformed+'; persistence failures: '+stats.errored+'. Stored state and immutable revisions are JSON objects under '+folder+'/.' )
              .addTable([
                [{data:'Comment',header:true},{data:'Transition',header:true},{data:'Accepted entries',header:true},{data:'URL',header:true}],
                ...rows.map(r=>r.map(data=>({data})))
              ]).write();
            if(failures.length)core.setFailed(failures.join('\n'));
      - name: Generate README candidate from schema job comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const {render}=require('./src/readme-comment-renderer.js');
            const owner=context.repo.owner,repo=context.repo.repo;
            const id=context.payload.comment.id;
            const {data:comment}=await github.rest.issues.getComment({owner,repo,comment_id:id});
            // Intermediate 1..16-entry arrays are drafts, not final README candidates.
            const body=comment.body||'';
            if(!body.includes('"RS17-README-001"')){
              core.info('Comment is not the README experiment job');
              return;
            }
            let parsed;
            try {parsed=JSON.parse(body);} catch(e) {return;}
            if(!Array.isArray(parsed)||parsed.length<17){
              core.info('README experiment comment is not yet a completed 17-entry array');
              return;
            }
            // Completion must be proven by sequential state transitions; an imported
            // 17-element array does not qualify as a controlled experiment.
            const statePath='workspaces/issue1-diagnostics/comments/'+id+'/state.json';
            let saved;
            try {saved=(await github.rest.repos.getContent({owner,repo,path:statePath})).data;}
            catch(e){if(e.status===404)return;throw e;}
            const state=JSON.parse(Buffer.from(saved.content,'base64').toString('utf8'));
            const {sha}=require('./src/issue1-diagnostics.js');
            if(state.progression?.mode!=='incremental'||
               state.progression?.complete!==true||
               state.last_processed_revision_sha256!==sha(body)||
               state.progression.controller_status!=='completed'){
              core.info('README candidate skipped: controlled incremental progression not verified');
              return;
            }
            const rendered=render(body,{commentId:id,repository:owner+'/'+repo});
            if(!rendered){
              core.info('Not the registered README schema job. No candidate created.');
              return;
            }
            const path='experiments/readme-job-001.candidate.md';
            const receiptPath='workspaces/readme-job-001/receipt.json';
            const currentReadme=await github.rest.repos.getContent({owner,repo,path:'README.md'});
            async function writeIfChanged(path,body){
              let existing=null;
              try{
                const {data}=await github.rest.repos.getContent({owner,repo,path});
                if(Array.isArray(data)||data.type!=='file')throw Error('Non-file target '+path);
                existing=data;
              }catch(e){if(e.status!==404)throw e;}
              if(existing && Buffer.from(existing.content,'base64').toString('utf8')===body){
                return {changed:false,sha:existing.sha};
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner,repo,path,
                message:'experiment: record schema README candidate from issue comment '+id,
                content:Buffer.from(body,'utf8').toString('base64'),
                ...(existing?{sha:existing.sha}:{})
              });
              const {data:check}=await github.rest.repos.getContent({owner,repo,path});
              if(Buffer.from(check.content,'base64').toString('utf8')!==body){
                throw Error('Readback mismatch at '+path);
              }
              return {changed:true,sha:check.sha};
            }
            const candidate=await writeIfChanged(path,rendered.content);
            const receipt={
              schema:'issuescratch.readme-experiment-receipt.v1',
              job_id:rendered.record.job_id,
              source_issue_number:1,
              source_comment_id:id,
              source_comment_sha256:rendered.sha256,
              source_instruction:rendered.record.instruction,
              scratchpad_entries:rendered.record.comment_entries,
              source_instruction_index:rendered.record.metadata_index,
              candidate_path:path,
              candidate_blob_sha:candidate.sha,
              conventional_readme_path:'README.md',
              conventional_readme_blob_sha:currentReadme.data.sha,
              candidate_status:'generated_and_verified',
              agent_workspace_writes_required:false,
              root_readme_replaced:false,
              selection_status:'awaiting_comparison'
            };
            await writeIfChanged(receiptPath,JSON.stringify(receipt,null,2)+'\n');
            core.info('Candidate generated for comment '+id+' with '+rendered.record.comment_entries+' scratchpads; retained root README.');
            await core.summary.addHeading('README schema experiment').addRaw(
              'Comment ID: '+id+'; candidate: '+path+'; source SHA-256: '+rendered.sha256+
              '; existing README.md preserved for comparison.'
            ).write();
      - name: Generate controlled README from external registration
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const {renderControlled,sha256}=require('./src/readme-comment-renderer.js');
            const {sha}=require('./src/issue1-diagnostics.js');
            const owner=context.repo.owner,repo=context.repo.repo;
            const id=context.payload.comment.id;
            const registrationPath='workspaces/readme-job-001-rerun/job.json';
            async function read(path){
              try{
                const {data}=await github.rest.repos.getContent({owner,repo,path});
                if(Array.isArray(data)||data.type!=='file')throw Error('Not a file: '+path);
                return {sha:data.sha,body:Buffer.from(data.content,'base64').toString('utf8')};
              }catch(e){if(e.status===404)return null;throw e;}
            }
            async function save(path,body,old){
              if(old?.body===body)return old.sha;
              await github.rest.repos.createOrUpdateFileContents({
                owner,repo,path,content:Buffer.from(body,'utf8').toString('base64'),
                message:'experiment: generate README from controlled 19-index comment '+id,
                ...(old?{sha:old.sha}:{})
              });
              const saved=await read(path);
              if(saved?.body!==body)throw Error('Controlled README write readback failed: '+path);
              return saved.sha;
            }
            const stored=await read(registrationPath);
            if(!stored){core.info('No controlled README job registered');return;}
            const reg=JSON.parse(stored.body);
            if(reg.source_comment_id!==id){core.info('Different source comment');return;}
            const {data:comment}=await github.rest.issues.getComment({owner,repo,comment_id:id});
            const body=comment.body||'';
            let arr;
            try{arr=JSON.parse(body);}catch{return;}
            if(!Array.isArray(arr)||arr.length!==19)return;
            const root='workspaces/issue1-diagnostics/comments/'+id;
            const stateFile=await read(root+'/state.json');
            if(!stateFile)throw Error('Missing controller state');
            const state=JSON.parse(stateFile.body);
            const progression=state.progression;
            if(progression?.mode!=='incremental'||!progression.complete||
               progression.accepted_entries!==19||progression.last_accepted_index!==18||
               progression.controller_status!=='completed'||
               state.last_processed_revision_sha256!==sha(body))throw Error('Controller completion mismatch');
            const accepted=state.history.filter(x=>['accepted_one_entry','completed_index_18'].includes(x.transition));
            if(accepted.length!==19||
               accepted.some((x,i)=>x.array_length!==i+1||x.accepted_entries_after!==i+1)){
              throw Error('Missing 19 sequential acceptance receipts');
            }
            const replyId=progression.controller_comment_id;
            if(!Number.isSafeInteger(replyId))throw Error('Missing controller reply ID');
            const {data:reply}=await github.rest.issues.getComment({owner,repo,comment_id:replyId});
            const control=JSON.parse(reply.body);
            if(control.source_comment_id!==id||control.history.length!==18)throw Error('Controller history is incomplete');
            // The workflow's own state and controller history are the handshake.
            // No worker-authored workspace acknowledgements are required.
            for(let index=1;index<=18;index++){
              const prior=control.history[index-1];
              if(prior.target_index!==index ||
                 prior.function?.target_index!==index ||
                 prior.function?.comment_id!==id ||
                 !prior.function?.selected_function?.opcode ||
                 prior.source_revision_sha256!==accepted[index-1].raw_sha256){
                throw Error('Controller instruction and accepted revision mismatch at '+index);
              }
            }
            const generated=renderControlled(body,{commentId:id,registration:reg,repository:owner+'/'+repo});
            const candidatePath=reg.candidate_path,receiptPath='workspaces/readme-job-001-rerun/receipt.json';
            const candidateSha=await save(candidatePath,generated.content,await read(candidatePath));
            const receipt={
              schema:'issuescratch.readme-controlled-receipt.v1',job_id:reg.job_id,
              source_comment_id:id,source_comment_sha256:sha256(body),
              accepted_entries:19,accepted_transitions:19,
              workflow_verified_transitions:19,controller_instruction_count:18,
              candidate_path:candidatePath,candidate_blob_sha:candidateSha,
              conventional_readme_path:'README.md',
              prior_comparator_path:'experiments/readme-job-001.candidate.md',
              selection_status:'awaiting_user_comparison',
              root_readme_replaced:false
            };
            await save(receiptPath,JSON.stringify(receipt,null,2)+'\n',await read(receiptPath));
            core.info('Controlled README candidate and receipt verified for '+id);
