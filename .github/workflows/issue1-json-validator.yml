name: Issue 1 JSON validation and diagnostic state
on:
  issue_comment:
    types: [created, edited]
  push:
    paths:
      - '.github/workflows/issue1-json-validator.yml'
      - 'src/issue1-diagnostics.js'
      - 'src/issue1-diagnostics.test.js'
      - 'src/opcode-document-adapter.js'
      - 'src/opcode-document-adapter.test.js'
      - 'src/readme-comment-renderer.js'
      - 'src/readme-comment-renderer.test.js'
      - 'src/types/issuescratch.operation-registry.v1.json'
      - 'src/types/issuescratch.opcode-adapter-contract.v1.json'
      - 'experiments/general-purpose-job-opcode-map.v1.json'
      - 'experiments/general-purpose-job-prompts.v1.json'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# Serialize writes into the same git branch, including different comment IDs.
concurrency:
  group: issuescratch-issue1-state
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'issue_comment' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deterministic analyzer and state machine
        run: node --test src/*.test.js
      - name: Convert prompt manifest with reusable functional opcodes
        if: github.event_name != 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {convert,validate}=require('./src/opcode-document-adapter.js');
            const owner=context.repo.owner,repo=context.repo.repo;
            const originalPath='experiments/general-purpose-job-prompts.v1.json';
            const mapPath='experiments/general-purpose-job-opcode-map.v1.json';
            const registryPath='src/types/issuescratch.operation-registry.v1.json';
            const outputPath='experiments/general-purpose-job-prompts.opcoded.v1.json';
            const source=fs.readFileSync(originalPath);
            const profile=JSON.parse(fs.readFileSync(mapPath,'utf8'));
            const registry=JSON.parse(fs.readFileSync(registryPath,'utf8'));
            const obj=convert(source,{
              registry,profile,sourcePath:originalPath,
              itemsPointer:profile.selected_pointer,
              idField:profile.identity_field,
              textField:profile.text_field
            });
            const verification=validate(obj,source,registry);
            if(verification.record_count!==17)throw Error('Prompt source must contain 17 records');
            const contents=JSON.stringify(obj,null,2)+'\n';
            let current;
            try{
              const {data}=await github.rest.repos.getContent({owner,repo,path:outputPath});
              current=data;
            }catch(e){
              if(e.status!==404)throw e;
            }
            const previous=current?Buffer.from(current.content,'base64').toString('utf8'):null;
            if(previous===contents){
              core.info('Output already matches the deterministic conversion');
            }else{
              await github.rest.repos.createOrUpdateFileContents({
                owner,repo,path:outputPath,
                message:'experiments: regenerate verified opcode-encoded prompt manifest',
                content:Buffer.from(contents,'utf8').toString('base64'),
                ...(current?{sha:current.sha}:{})
              });
            }
            const {data:check}=await github.rest.repos.getContent({owner,repo,path:outputPath});
            const actual=Buffer.from(check.content,'base64').toString('utf8');
            if(actual!==contents)throw Error('Converted artifact readback mismatch');
            core.info('Converted manifest verified: '+verification.record_count+' records; '+verification.opcode_occurrences+' opcode occurrences');
      - name: Generate README candidate from schema job comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const {render}=require('./src/readme-comment-renderer.js');
            const owner=context.repo.owner,repo=context.repo.repo;
            const id=context.payload.comment.id;
            const {data:comment}=await github.rest.issues.getComment({owner,repo,comment_id:id});
            const rendered=render(comment.body||'',{commentId:id,repository:owner+'/'+repo});
            if(!rendered){
              core.info('Not the registered README schema job. No candidate created.');
              return;
            }
            const path='experiments/readme-job-001.candidate.md';
            const receiptPath='workspaces/readme-job-001/receipt.json';
            const currentReadme=await github.rest.repos.getContent({owner,repo,path:'README.md'});
            async function writeIfChanged(path,body){
              let existing=null;
              try{
                const {data}=await github.rest.repos.getContent({owner,repo,path});
                if(Array.isArray(data)||data.type!=='file')throw Error('Non-file target '+path);
                existing=data;
              }catch(e){if(e.status!==404)throw e;}
              if(existing && Buffer.from(existing.content,'base64').toString('utf8')===body){
                return {changed:false,sha:existing.sha};
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner,repo,path,
                message:'experiment: record schema README candidate from issue comment '+id,
                content:Buffer.from(body,'utf8').toString('base64'),
                ...(existing?{sha:existing.sha}:{})
              });
              const {data:check}=await github.rest.repos.getContent({owner,repo,path});
              if(Buffer.from(check.content,'base64').toString('utf8')!==body){
                throw Error('Readback mismatch at '+path);
              }
              return {changed:true,sha:check.sha};
            }
            const candidate=await writeIfChanged(path,rendered.content);
            const receipt={
              schema:'issuescratch.readme-experiment-receipt.v1',
              job_id:rendered.record.job_id,
              source_issue_number:1,
              source_comment_id:id,
              source_comment_sha256:rendered.sha256,
              source_instruction:rendered.record.instruction,
              scratchpad_entries:rendered.record.comment_entries,
              source_instruction_index:rendered.record.metadata_index,
              candidate_path:path,
              candidate_blob_sha:candidate.sha,
              conventional_readme_path:'README.md',
              conventional_readme_blob_sha:currentReadme.data.sha,
              candidate_status:'generated_and_verified',
              root_readme_replaced:false,
              selection_status:'awaiting_comparison'
            };
            await writeIfChanged(receiptPath,JSON.stringify(receipt,null,2)+'\n');
            core.info('Candidate generated for comment '+id+' with '+rendered.record.comment_entries+' scratchpads; retained root README.');
            await core.summary.addHeading('README schema experiment').addRaw(
              'Comment ID: '+id+'; candidate: '+path+'; source SHA-256: '+rendered.sha256+
              '; existing README.md preserved for comparison.'
            ).write();
      - name: Validate, measure, and persist comment state
        uses: actions/github-script@v7
        with:
          script: |
            const { processRevision, sha } = require('./src/issue1-diagnostics.js');
            const owner = context.repo.owner, repo = context.repo.repo;
            const eventName = context.eventName;
            const scan = eventName !== 'issue_comment';
            const comments = scan
              ? await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: 1, per_page: 100 })
              : [context.payload.comment];
            const folder = 'workspaces/issue1-diagnostics/comments';
            const stats = { inspected: 0, recorded: 0, duplicates: 0, malformed: 0, errored: 0 };
            const rows = [];
            const failures = [];

            async function readFile(path) {
              try {
                const { data } = await github.rest.repos.getContent({owner,repo,path});
                if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64') {
                  throw new Error('Expected base64 JSON file at ' + path);
                }
                return { sha: data.sha, value: JSON.parse(Buffer.from(data.content,'base64').toString('utf8')) };
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
            }
            async function writeObject(path, value, previous) {
              if (!value || typeof value !== 'object' || Array.isArray(value)) {
                throw new Error('Diagnostic and state roots must be JSON objects');
              }
              const body = JSON.stringify(value,null,2) + '\n';
              const args = {
                owner,repo,path,
                message: 'diagnostics: capture Issue #1 comment revision state',
                content: Buffer.from(body,'utf8').toString('base64'),
                ...(previous ? {sha:previous.sha} : {})
              };
              await github.rest.repos.createOrUpdateFileContents(args);
              const verified = await readFile(path);
              if (!verified || JSON.stringify(verified.value) !== JSON.stringify(value)) {
                throw new Error('Persistent JSON readback mismatch: '+path);
              }
            }
            for (const item of comments) {
              const id = item.id;
              const url = item.html_url || ('https://github.com/'+owner+'/'+repo+'/issues/1#issuecomment-'+id);
              stats.inspected++;
              try {
                // Re-fetch current source: an event payload may represent a superseded edit.
                const {data:current} = await github.rest.issues.getComment({owner,repo,comment_id:id});
                const body = current.body ?? '';
                const revisionSha = sha(body);
                const root = folder+'/'+id;
                const statePath = root+'/state.json';
                const revisionPath = root+'/revisions/'+revisionSha+'.json';
                const existingState = await readFile(statePath);
                const priorState = existingState?.value ?? null;
                const result = processRevision(priorState,body,id,revisionPath,eventName);
                if (result.duplicate) {
                  stats.duplicates++;
                  rows.push([String(id),'unchanged',String(priorState?.progression?.accepted_entries??0),url]);
                  continue;
                }
                // Immutable diagnostic snapshots. Persist before advancing the state pointer.
                const previousDiagnostic = await readFile(revisionPath);
                if (previousDiagnostic) {
                  if (JSON.stringify(previousDiagnostic.value)!==JSON.stringify(result.diagnostic)) {
                    throw new Error('Immutable revision hash conflicts with stored diagnostics');
                  }
                } else {
                  await writeObject(revisionPath,result.diagnostic,null);
                }
                await writeObject(statePath,result.state,existingState);
                stats.recorded++;
                if (!result.diagnostic.source.json_valid) {
                  stats.malformed++;
                  core.warning('Comment '+id+': invalid JSON; state unchanged; diagnostic saved at '+revisionPath);
                } else if (result.diagnostic.source.validation_error) {
                  core.warning('Comment '+id+': '+result.diagnostic.source.validation_error.message+'; diagnostic saved');
                }
                rows.push([String(id),result.action,
                  String(result.state.progression.accepted_entries),url]);
              } catch (e) {
                stats.errored++;
                failures.push('comment '+id+': '+e.message);
                core.error('comment '+id+': '+e.message);
                rows.push([String(id),'persistence error','—',url]);
              }
            }
            await core.summary
              .addHeading('Issue #1 deterministic JSON diagnostics')
              .addRaw('Event: '+eventName+'; inspected: '+stats.inspected+'; recorded: '+stats.recorded+'; repeated: '+stats.duplicates+'; invalid JSON: '+stats.malformed+'; persistence failures: '+stats.errored+'. Stored state and immutable revisions are JSON objects under '+folder+'/.' )
              .addTable([
                [{data:'Comment',header:true},{data:'Transition',header:true},{data:'Accepted entries',header:true},{data:'URL',header:true}],
                ...rows.map(r=>r.map(data=>({data})))
              ]).write();
            if(failures.length)core.setFailed(failures.join('\n'));
