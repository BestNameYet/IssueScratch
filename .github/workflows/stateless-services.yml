name: Stateless HTTP services
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stateless-services.yml'
      - 'src/stateless-fsm.js'
      - 'src/http-json-service.js'
      - 'src/fsm-server.js'
      - 'src/agent-renderer.js'
      - 'src/renderer-server.js'
      - 'src/github-issue-writer.js'
      - 'src/github-issue-writer.test.js'
      - 'src/stateless-router-server.js'
      - 'src/router-validator-server.js'
      - 'src/router-envelope-validator.js'
      - 'src/router-boundary.test.js'
      - 'src/envelope-services.test.js'
      - 'src/router-mode-contract.test.js'
      - 'src/renderer-server.js'
      - 'src/validation-service.test.js'
      - 'container-listener.js'
      - 'container-entrypoint.js'
      - 'Dockerfile'
      - 'src/stateless-services.test.js'
      - 'src/router-write-gate.test.js'
      - 'src/input-validator.js'
      - 'src/validation-server.js'
      - 'src/validation-service.test.js'
      - 'config/stateless-services.json'
      - 'src/types/issuescratch.procedure-library.v1.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test callable GitHub Issue writer
        run: node --test src/github-issue-writer.test.js
      - name: Test independent services and HTTP routing
        run: node --test src/stateless-services.test.js src/validation-service.test.js src/router-write-gate.test.js src/router-boundary.test.js src/envelope-services.test.js src/router-mode-contract.test.js

      - name: Verify Docker HTTPS egress and environment propagation
        env:
          GITHUB_TOKEN: connectivity-smoke-not-a-credential
        run: |
          docker build --tag issuescratch-runtime:connectivity-smoke .
          docker run --rm --network bridge -e GITHUB_TOKEN -e GITHUB_REPOSITORY \
            --entrypoint node issuescratch-runtime:connectivity-smoke -e '
              if (process.env.GITHUB_TOKEN !== "connectivity-smoke-not-a-credential" ||
                  process.env.GITHUB_REPOSITORY !== "BestNameYet/IssueScratch") {
                process.stderr.write("Container environment forwarding failed\n");
                process.exit(2);
              }
              fetch("https://api.github.com/zen", {signal: AbortSignal.timeout(15000)})
                .then(response => {
                  if (response.status >= 500) throw Error("GitHub HTTPS service returned "+response.status);
                  console.log("Container HTTPS response "+response.status+"; network and environment verified, API authorization not asserted");
                })
                .catch(error => { console.error(error.message); process.exitCode=1; });
            '
